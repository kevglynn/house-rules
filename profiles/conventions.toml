# process-kit conventions profile — single source of truth for the kit's
# data-shaped conventions.
# Design: docs/specs/2026-08-05-profile-projection-tier1.md (Tier 1, GO 2026-08-05).
#
# Two projections come off this file:
#   1. Rule text — GENERATED-marked fragments committed inside cursor/rules/
#      (render: `scripts/conventions render-rule <fragment>`; the kit-ci regen
#      gate runs `scripts/conventions render-rule --check` and fails on drift).
#   2. Checker behavior — `scripts/conventions` check-commit / check-branch /
#      check-close read this profile at runtime.
#
# Honesty rule (carried from the spike): this file encodes what the rule prose
# PRESCRIBES. Where the prose is judgment-shaped, `judgment` lists say so
# explicitly rather than pretending a regex covers it.
#
# Pattern entries: a detector is either a bare regex string or a
# { pattern = '...', flags = ["IGNORECASE", ...] } table; flags name Python
# `re` module constants. Later children (TDD obligations) add their
# sections here using the same entry shape.
#
# Schema notes:
#   - `judgment` lists are checker-side annotations and never render — with
#     one legacy exception: [git].judgment IS rendered verbatim as fragment
#     bullets.
#   - Pass-through prose enters the profile only when it lives inside a law
#     paragraph a fragment must render; standalone why-paragraphs stay
#     hand-written in the rule file, outside the marked region.
#   - Key vocabulary: `rule_*` is the blessed prefix for render-only keys
#     (consumed by fragment renderers, never by checkers); new sections use
#     `display` for a matcher's human-readable name. [defer.clauses].label
#     and [close_evidence.elements].description are grandfathered spellings
#     from before this convention — do not propagate them to new sections.

schema_version = 1
profile = "process-kit"

# ---------------------------------------------------------------------------
# 1a. Commit-message grammar
# Law home: cursor/rules/operating-model.mdc § Git Conventions (generated).
# `spike` sanctioned as a commit type by decision record process-kit-8qv,
# 2026-08-05; `wip` remains unsanctioned.
# ---------------------------------------------------------------------------
[commit]
format = "<type>: <summary>"
types = ["feat", "fix", "refactor", "test", "chore", "docs", "spike"]
# "under 72" read strictly: len(summary first line) < 72. The prose says
# "summaries", not "subject line", so the cap applies after "<type>: ".
summary_max_chars = 72

# ---------------------------------------------------------------------------
# 1b. Branch-naming grammar
# `spike` is NOT a branch type — only the commit type was sanctioned
# (process-kit-8qv, 2026-08-05); the demo-case baseline pins spike/... branches as
# rejected. The prose grammar is not deterministically parseable (<bead-id>
# and <short-description> are both kebab-case), so the checker validates the
# checkable envelope: known type + "/" + lowercase kebab slug with >= 2
# hyphen-separated segments. Documented, not fixed, in Tier 1.
# ---------------------------------------------------------------------------
[branch]
format = "<type>/<bead-id>-<short-description>"
types = ["feat", "fix", "refactor", "test", "chore", "docs"]
# \Z (not $): a trailing newline must not sneak past the anchor.
slug_pattern = '^[a-z0-9]+(-[a-z0-9]+)+\Z'

# ---------------------------------------------------------------------------
# 1c. Judgment-shaped git law — rendered verbatim as fragment bullets. No
# checker can verify these; they live here so the whole Git Conventions
# section stays single-sourced.
# ---------------------------------------------------------------------------
[git]
judgment = [
  "Commit at logical checkpoints, small and atomic — not one giant commit at bead close. Never force push shared branches without explicit user approval.",
]

# ---------------------------------------------------------------------------
# 2. Close-evidence shape, per bead type
# Law home: cursor/rules/bead-completion.mdc evidence table (generated).
#
# This section has two readers with different scopes — the contract per key:
#
#   `evidence`     rendered into the table's "Required evidence" column.
#   `judgment`     annotation no checker can verify (never rendered here).
#   `requires`     names this type's evidence elements. `conventions
#                  check-close` (kit CI only, never distributed) enforces
#                  every named element and validates that named elements
#                  exist in the element library. `close-reason-lint` (the
#                  distributed stream checker) consumes `requires` ONLY to
#                  classify types: a type whose requires are entirely
#                  prose-shaped (the two schema-reserved element names
#                  na_marker and children_closed) is EXEMPT from the stream
#                  lint — its canonical close is N/A prose or a
#                  children-closed statement, no commit/AC shape to demand.
#                  Mixed lists (prose-shaped + artifact elements) stay
#                  checked. The stream checker does NOT enforce other
#                  requires entries and does NOT validate element existence
#                  — a profile can be stream-linter-valid yet
#                  check-close-invalid.
#   `commit_ref_severity`  stream-linter only (default "error"): softens
#                  that type's missing commit-ref finding to a warning —
#                  summary-evidence types only. check-close is unaffected
#                  and still errors where `requires` names commit_ref.
#   `row`/`row_label`  rendering only: `row = false` keeps a type
#                  checker-known without a table row (task shares feature's
#                  shape but the committed table never had a Task row;
#                  config folds into the "Chore/config" row); `row_label`
#                  overrides the default capitalized type name.
#
# The stream checker always enforces commit_ref presence, AC-mapping when
# the bead carries ACs, and the IOU ban on every non-exempt type — that
# scope is code, not `requires` data. Resolution/fallback posture matches
# [defer]: no discoverable profile, or a discovered profile without this
# section, falls back to the checker's built-in copy (test-pinned
# structural parity); explicit selection missing the section is an error.
# ---------------------------------------------------------------------------
[close_evidence]
# IOU phrases mark deferral-instead-of-evidence — banned in every close
# reason (bead-completion "Do not defer AC verification"). The one
# sanctioned deferral form is exempted below; the follow-up bead must exist
# at close time.
# Substring-matched: "verified later" also covers "will be verified later".
iou_phrases = [
  "will be re-verified",
  "deferred to PR review",
  "deferred to integration",
  "to be re-checked",
  "verified later",
]
iou_exempt = { pattern = 'deferred to bead \S+', flags = ["IGNORECASE"] }

# Element library: deterministic detectors for the evidence shapes a close
# reason must visibly carry. Presence only — evidence QUALITY stays with
# self-review and the review lenses.
# Reconciled toward close-reason-lint's production detectors
# (process-kit-ywq): a hash must carry a digit (an all-letter hex-alphabet
# word like "effaced" is English, not a hash), a branch citation needs a
# branch-shaped token (bare "branch" prose cites no branch), all forge
# PR/MR URL forms count, and AC detection stays case-sensitive (lowercase
# "ac" is an English fragment). One {pattern, flags} entry cannot express
# per-alternative flag mixes, so the case-insensitive alternatives use
# inline (?i:...) groups and these two entries carry no flags list —
# deliberate schema decision, not an omission.
[close_evidence.elements.commit_ref]
description = "commit hash (7-40 lowercase hex with a digit), branch name, or PR/MR URL"
pattern = '''\b(?=[0-9a-f]*\d)[0-9a-f]{7,40}\b|https?://\S+/(?:pull|pulls|pull-requests|merge_requests)/\d+|\b(?:feat|fix|refactor|test|chore|docs|feature|bugfix|hotfix|release|spike|wip)/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+(?![\w\-/]|\.\w)|(?i:\bbranch\b[:\s]+[`'\"]?[A-Za-z0-9._/-]*[-/][A-Za-z0-9._/-]*)'''

[close_evidence.elements.ac_mapping]
description = "explicit mapping to acceptance criteria (AC1, AC 2, AC-3, ACs, acceptance criteria)"
pattern = '\bAC\s*[-–]?\s*\d+|\bACs?\b|(?i:\bacceptance\s+criteri(?:a|on))'

[close_evidence.elements.na_marker]
description = "explicit N/A marker for types whose table row prescribes it"
pattern = 'N/A'
flags = ["IGNORECASE"]

[close_evidence.elements.findings_summary]
description = "spike: summary of findings / whether the question was answered"
pattern = '\bfinding|\banswer|\bconclusion|\brecommend|\bwon.t.do\b|\bobsolete\b'
flags = ["IGNORECASE"]

[close_evidence.elements.children_closed]
description = "epic/milestone: statement that children are closed/verified"
pattern = '\bchild(?:ren)?\b.*\bclos|\bclos\w*\b.*\bchild(?:ren)?\b'
# DOTALL: real close reasons are multiline; "children ... closed" must be
# allowed to span a line break.
flags = ["IGNORECASE", "DOTALL"]

# Table-row order below is the rendered order — it mirrors the committed
# evidence table in bead-completion.mdc.
[close_evidence.by_type.bug]
evidence = "Test output showing bug is reproduced and fixed"
requires = ["commit_ref", "ac_mapping"]
judgment = ["test output actually shows the bug reproduced and fixed"]

[close_evidence.by_type.feature]
evidence = "Test output or manual verification notes per AC"
requires = ["commit_ref", "ac_mapping"]
judgment = ["test output / manual verification genuinely covers each AC"]

[close_evidence.by_type.story]
evidence = "Test output or manual verification per AC (same as feature)"
requires = ["commit_ref", "ac_mapping"]
judgment = ["same as feature"]

[close_evidence.by_type.spike]
evidence = "Summary of findings; whether the question was answered"
requires = ["findings_summary"]
# Stream linter: spike evidence is findings, not a commit — a missing
# commit-ref reports at warning severity.
commit_ref_severity = "warning"
judgment = ["findings are real; the spike question was actually answered"]

[close_evidence.by_type.refactor]
evidence = "Build/lint clean, existing behavioral tests pass"
requires = ["commit_ref"]
judgment = ["build/lint clean; behavioral tests actually passed"]

[close_evidence.by_type.chore]
row_label = "Chore/config"
evidence = "Brief summary of what was done"
requires = ["commit_ref"]
# Stream linter: the table asks only a brief summary, so a missing
# commit-ref reports at warning severity (check-close still requires it).
commit_ref_severity = "warning"
judgment = ["summary reflects what was done"]

# Folded into the "Chore/config" row above; checker treats it as its own type.
[close_evidence.by_type.config]
row = false
requires = ["commit_ref"]
commit_ref_severity = "warning"
judgment = ["summary reflects what was done"]

# Checker-known; the committed table has no Task row (same shape as feature).
[close_evidence.by_type.task]
row = false
requires = ["commit_ref", "ac_mapping"]
judgment = ["verification notes genuinely cover each AC"]

[close_evidence.by_type.docs]
evidence = '"N/A — documentation update, no verification needed"'
requires = ["na_marker"]
judgment = []

[close_evidence.by_type.decision]
evidence = '"N/A — decision record, no verification needed"'
requires = ["na_marker"]
judgment = []

[close_evidence.by_type.milestone]
evidence = '"N/A — milestone marker, verify children are closed"'
requires = ["na_marker"]
judgment = ["children actually closed"]

[close_evidence.by_type.epic]
evidence = "Verify all children closed (`bd epic close-eligible`), then confirm each success criterion is met by the closed children's outcomes. If a criterion is unmet, create a follow-up bead before closing."
requires = ["children_closed"]
judgment = ["each success criterion genuinely met by the closed children"]

# ---------------------------------------------------------------------------
# 3. Defer-comment grammar
# Law home: cursor/rules/defer-convention.mdc (generated fragment).
# scripts/defer-lint reads this section at runtime; a tree with no
# discoverable profile — or a profile without this section — falls back to
# the checker's built-in copy of the same grammar, preserving its standalone
# advisory posture (test-pinned parity guards the fallback against drift).
#
# Content-side exclusion contract (design doc): this data file is itself a
# scanned .toml source, so its grammar strings must never trip the scanner.
# The marker word is stored apart from its suffix and the worked example is
# assembled by the renderer, so no line here carries a comment-prefix-
# adjacent marker occurrence — the same clean-by-construction idiom the
# checker's own source uses. The defer-lint suite pins this with a fixture
# that scans a copy of this file.
# ---------------------------------------------------------------------------
[defer]
marker_word = "defer"
marker_suffix = ":"
format = "<what was simplified>. ceiling: <known limitation>. upgrade when: <trigger condition>."
# Canonical prefixes as the rule displays them; the renderer's worked
# example uses the first one.
comment_prefixes = ["//", "#", "/* */", "--"]
continuation_note = "the ceiling and trigger may continue on the following comment line(s)"
no_trigger_law = "A deferral without a trigger is just a TODO with a fancier name. If you can't name when to revisit, either the simplification is permanent (no comment needed) or you don't understand the ceiling yet (investigate before deferring)."
marker_meaning = "deliberate simplification with known limits (structured — ceiling + trigger required)"
marker_comparison = [
  { marker = "TODO", meaning = "unstructured reminder" },
  { marker = "FIXME", meaning = "actually broken" },
]
# Judgment note (checker-side, never rendered): ceiling and trigger must
# name a real limitation and a real revisit condition — the checker
# verifies presence, not meaning.

# What the checker accepts: regex alternates for comment prefixes on the
# marker line and on continuation lines (block-comment interiors and
# repeated marks included — deliberately wider than the four display
# prefixes above).
[defer.scan]
marker_line_prefixes = ['#+', '//+', '/\*+', '--+', '\*+']
continuation_prefixes = ['#+', '//+', '--+', '\*+']
skip_dirs = [
  ".git", "node_modules", "__pycache__", ".venv", "venv", ".tox",
  "dist", "build", "target", "vendor", ".beads", ".dolt", ".next",
  ".cache", ".mypy_cache", ".pytest_cache",
]
# Well-known extensionless source files scanned by name; extensionless
# files with a shebang are scanned regardless (behavior, not data).
extra_filenames = ["Makefile", "Dockerfile"]
# Source files only: docs/markdown quote worked examples as prose and are
# deliberately not scanned.
source_exts = [
  ".py", ".pyi", ".js", ".mjs", ".cjs", ".jsx", ".ts", ".tsx", ".rs",
  ".go", ".java", ".kt", ".kts", ".scala", ".c", ".h", ".cc", ".cpp",
  ".hpp", ".cs", ".m", ".mm", ".swift", ".rb", ".php", ".pl", ".pm",
  ".lua", ".sql", ".sh", ".bash", ".zsh", ".ps1", ".r", ".jl", ".ex",
  ".exs", ".erl", ".hs", ".elm", ".clj", ".cljs", ".dart", ".groovy",
  ".tf", ".hcl", ".yaml", ".yml", ".toml", ".ini", ".cfg", ".css",
  ".scss", ".less", ".vue", ".svelte", ".mk",
]

# The no-trigger law, checker-shaped: a defer missing an error-severity
# clause fails the scan (exit 1); warning-severity clauses report without
# failing. Table order below is the order findings list missing clauses.
# `label` (upgrade-when only) is the display name the rendered rule
# quotes; `pattern` is what the checker matches in collected comment text.
[defer.clauses."upgrade-when"]
label = "upgrade when:"
pattern = 'upgrade\s+when:'
flags = ["IGNORECASE"]
severity = "error"

[defer.clauses.ceiling]
pattern = 'ceiling:'
flags = ["IGNORECASE"]
severity = "warning"

# ---------------------------------------------------------------------------
# 4. Banned-token catalog (agent-identity rule)
# Law home: cursor/rules/agent-identity.mdc catalog enumeration (generated).
# scripts/banned-token-scan reads this section at runtime; resolution and
# fallback posture match [defer] / [close_evidence] (standalone advisory
# posture, test-pinned parity with the checker's built-in copy).
#
# Entry shape: { display, pattern, flags } — `display` is the token name
# findings report; `pattern` is the matcher; flags name `re` constants.
# The one flag-free entry is deliberate: that acronym is banned in its
# uppercase form only. Entry order within a class is MATCHER order:
# longest display first, so overlap dedupe keeps the most specific token
# (person-<unit> wins over the bare unit).
#
# `rule_label` / `rule_items` / `rule_note` are render-only: the rule's
# enumeration order and spellings are pedagogical and differ from matcher
# order, and one enumeration item can stand for a composed matcher
# ("N <unit>" families). A class's rule_items count must equal its
# entries count — the renderer enforces this so a catalog edit cannot
# silently skip the rendered rule. Ceiling: the count guard catches
# added/removed entries, not an in-place edit that changes one entry
# while leaving the counts equal — the regen gate's byte-match is what
# catches those.
#
# Content-side exclusion contract (design doc + the gsx Tier 1 note): this
# section is token-laden BY DESIGN — a catalog cannot be assembled from
# parts the way [defer]'s marker is. The contract: lines between the two
# marker lines below (the exclude_marker with ":begin" / ":end" appended)
# are declared token DATA, and the scanner suppresses matching there — in
# this file and in every distributed copy, at any path. The suffixes are
# stored apart from the base marker so the config line below cannot
# itself open or close a region.
# ---------------------------------------------------------------------------
[tokens]
exclude_marker = "banned-token-scan:declared-tokens"

# banned-token-scan:declared-tokens:begin — catalog data, scanner-excluded
[tokens.classes.time_units]
report_as = "time-units"
rule_label = "Time units"
rule_items = [
  "hours", "days", "weeks", "months", "quarters", "sprints", "man-hours",
  "person-hours", "engineer-hours", "dev-hours", "story points",
]
entries = [
  { display = "engineer-hours", pattern = '\bengineer-hours\b', flags = ["IGNORECASE"] },
  { display = "person-hours", pattern = '\bperson-hours\b', flags = ["IGNORECASE"] },
  { display = "story points", pattern = '\bstory\s+points\b', flags = ["IGNORECASE"] },
  { display = "man-hours", pattern = '\bman-hours\b', flags = ["IGNORECASE"] },
  { display = "dev-hours", pattern = '\bdev-hours\b', flags = ["IGNORECASE"] },
  { display = "quarters", pattern = '\bquarters\b', flags = ["IGNORECASE"] },
  { display = "sprints", pattern = '\bsprints\b', flags = ["IGNORECASE"] },
  { display = "months", pattern = '\bmonths\b', flags = ["IGNORECASE"] },
  { display = "hours", pattern = '\bhours\b', flags = ["IGNORECASE"] },
  { display = "weeks", pattern = '\bweeks\b', flags = ["IGNORECASE"] },
  { display = "days", pattern = '\bdays\b', flags = ["IGNORECASE"] },
]

[tokens.classes.team_size]
report_as = "team-size"
rule_label = "Team-size claims"
rule_note = "as a sizing unit"
rule_items = [
  "one developer", "a developer", "two engineers", "small team",
  "team of N", "with more people", "engineering team",
]
entries = [
  { display = "with more people", pattern = '\bwith\s+more\s+people\b', flags = ["IGNORECASE"] },
  { display = "engineering team", pattern = '\bengineering\s+team\b', flags = ["IGNORECASE"] },
  { display = "one developer", pattern = '\bone\s+developer\b', flags = ["IGNORECASE"] },
  { display = "a developer", pattern = '\ba\s+developer\b', flags = ["IGNORECASE"] },
  { display = "small team", pattern = '\bsmall\s+team\b', flags = ["IGNORECASE"] },
  { display = "team of N", pattern = '\bteam\s+of\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\b', flags = ["IGNORECASE"] },
  { display = "N engineers", pattern = '\b(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)(?:\s*[-–]\s*(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten))?\s+engineers\b', flags = ["IGNORECASE"] },
]

[tokens.classes.schedule]
report_as = "schedule-framing"
rule_label = "Schedule framing"
rule_note = "as a schedule claim, not a scope claim"
rule_items = [
  "timeline", "schedule", "ambitious", "aggressive", "on track", "ETA",
  "by EOD", "by end of week", "takes a while", "takes long", "quick win",
]
entries = [
  { display = "by end of week", pattern = '\bby\s+end\s+of\s+week\b', flags = ["IGNORECASE"] },
  { display = "takes a while", pattern = '\btakes\s+a\s+while\b', flags = ["IGNORECASE"] },
  { display = "aggressive", pattern = '\baggressive\b', flags = ["IGNORECASE"] },
  { display = "takes long", pattern = '\btakes\s+long\b', flags = ["IGNORECASE"] },
  { display = "ambitious", pattern = '\bambitious\b', flags = ["IGNORECASE"] },
  { display = "quick win", pattern = '\bquick\s+win\b', flags = ["IGNORECASE"] },
  { display = "timeline", pattern = '\btimeline\b', flags = ["IGNORECASE"] },
  { display = "schedule", pattern = '\bschedule\b', flags = ["IGNORECASE"] },
  { display = "on track", pattern = '\bon\s+track\b', flags = ["IGNORECASE"] },
  { display = "by EOD", pattern = '\bby\s+EOD\b', flags = ["IGNORECASE"] },
  { display = "ETA", pattern = '\bETA\b', flags = [] },
]

[tokens.classes.estimation_verbs]
report_as = "estimation-verbs"
rule_label = "Estimation verbs"
rule_items = ["I estimate", "I'd estimate", "rough estimate", "ballpark", "roughly N hours/days/weeks"]
entries = [
  { display = "roughly N <unit>", pattern = '\broughly\s+(?:\d+|one|two|three|four|five|six|seven|eight|nine|ten)\s+(?:hours|days|weeks)\b', flags = ["IGNORECASE"] },
  { display = "rough estimate", pattern = '\brough\s+estimate\b', flags = ["IGNORECASE"] },
  { display = "I'd estimate", pattern = "\\bI['’]d\\s+estimate\\b", flags = ["IGNORECASE"] },
  { display = "I estimate", pattern = '\bI\s+estimate\b', flags = ["IGNORECASE"] },
  { display = "ballpark", pattern = '\bballpark\b', flags = ["IGNORECASE"] },
]
# banned-token-scan:declared-tokens:end

# ---------------------------------------------------------------------------
# 5. TDD obligations by bead type
# Law home: cursor/rules/pragmatic-tdd.mdc § Obligations by bead type +
# § Exceptions (generated). Render-only today, so every key wears the
# rule_* prefix: no checker consumes this section — tdd-ledger is
# deliberately type-agnostic (its verify invariant is red-before-green per
# test_id, no bead-type field exists in ledger entries; process-kit-k6k
# JIT finding). Parameterization trigger: the first consumer that passes
# bead types into tdd-ledger verify reads its per-type obligations here.
# Row order below is the rendered table/list order — it mirrors the
# committed rule text. Obligation IDs (O1-O16) are part of the row text;
# their definitions stay prose-side in skills/pragmatic-tdd.
# ---------------------------------------------------------------------------
[tdd.by_type.bug]
rule_label = "Bug"
rule_obligation = "A test that reproduces the bug is written FIRST and must fail on the current code (O1). Before close, scan for the bug's pattern class across the codebase and fix every site or file follow-up beads (O5)."

[tdd.by_type.feature]
rule_label = "Feature"
rule_obligation = "Failing tests asserting each acceptance criterion (observable behavior, not internals) are written before implementation (O6)."

[tdd.by_type.story]
rule_label = "Story"
rule_obligation = "Identical to feature — ACs become tests (O8)."

[tdd.by_type.refactor]
rule_label = "Refactor"
rule_obligation = "A behavioral safety net exists BEFORE structure changes; all behavioral tests still pass after (O9)."

# Exceptions render as the "no tests required" bulleted list.
[tdd.exceptions.spike]
rule_label = "Spike"
rule_note = "deliverable is knowledge; findings go in the close reason. Prototype code promoted to a feature inherits the feature obligation (O10)."

[tdd.exceptions.decision_milestone]
rule_label = "Decision / milestone"
rule_note = "ADRs and completion markers produce no testable code (O11)."

[tdd.exceptions.epic]
rule_label = "Epic"
rule_note = "containers; obligations apply to children, not the epic (O12)."

[tdd.exceptions.chore_config_docs]
rule_label = "Chore / config / docs"
rule_note = "a test here is noise (O13)."

# ---------------------------------------------------------------------------
# 6. Fragment homes — where each rendered fragment is committed, relative to
# the repo root. `render-rule --check` (the kit-ci regen gate) iterates this
# table: render each fragment, extract the GENERATED-marked region from the
# file, fail on any byte difference.
#
# LAW: one marked region per rule file. The marker pair is unnamed, so two
# fragments can never share a file; a duplicated pair reports
# duplicate-markers. Children adding fragments target files without an
# existing region.
# ---------------------------------------------------------------------------
[fragments."git-conventions"]
file = "cursor/rules/operating-model.mdc"

[fragments."close-evidence"]
file = "cursor/rules/bead-completion.mdc"

[fragments."defer-convention"]
file = "cursor/rules/defer-convention.mdc"

[fragments."agent-identity"]
file = "cursor/rules/agent-identity.mdc"

[fragments."tdd-obligations"]
file = "cursor/rules/pragmatic-tdd.mdc"
