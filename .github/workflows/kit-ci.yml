# Kit self-enforcement — the kit runs the checks its doctrine prescribes.
# Fourteen gates: (1) the claude/rules projection must match the cursor/rules
# canon (sync-rules.sh --check --local), (2) the GENERATED rule fragments
# must match their render from profiles/conventions.toml (conventions
# render-rule --check), (3) all shell scripts pass shellcheck at warning
# severity, (4) the installer marker-rewrite loops keep their fixture
# guarantees (idempotency, malformed-marker refusal),
# (5) the standalone checker suites hold their drift guards (fallback
# parity pins, verbatim plumbing pins, exclusion contract, posture tests),
# (6) profile distribution and the profile_drift SUMMARY contract hold
# (byte-identical copy, exact key string, precedence, optional branch),
# (7) shell commands fenced in the user-facing docs reference script
# paths that exist in the tree (docs-path-lint), (8) the core-tier
# manifest stays valid and its listed files stay bd/beads-clean
# (test_core_manifest, in checker-suites), (9) the plugin manifests on
# the three distribution surfaces stay schema-valid, path-resolvable,
# and derived from the core manifest (test_plugin_manifests, in
# checker-suites), (10) tier stamp / tier-aware doctor / sync exclusion /
# upgrade-offer fixtures (test_tier_mechanics.sh), (11) the sync's cleanup
# pass keeps project-authored rules and still retires kit rules
# (test_sync_cleanup.sh), (12) the Tier 2 assembler names no model vendor
# unless the caller asked for one (test_tier2_assemble, in checker-suites),
# (13) the distributed surface names no vendor model, person, or private
# tool (neutrality-scan, with a seeded-leak self-test), (14) re-running init
# over an existing install never destroys a local edit (test_init_backup.sh).

name: kit ci

on:
  push:
  pull_request:

jobs:
  projection-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Claude projection matches cursor canon
        run: ./scripts/sync-rules.sh --format claude --check --local
      - name: Gate self-test — seeded drift must fail the check
        run: |
          echo "# seeded drift" >> claude/rules/pragmatic-tdd.md
          if ./scripts/sync-rules.sh --format claude --check --local; then
            echo "seeded projection drift did NOT fail the gate" >&2
            exit 1
          fi
          git checkout -- claude/rules/pragmatic-tdd.md
          echo "gate correctly rejects seeded drift"

  fragment-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run conventions test suite
        run: python3 scripts/tests/test_conventions.py
      - name: Rule fragments match profile render
        run: python3 scripts/conventions render-rule --check
      - name: Gate self-test — seeded fragment drift must fail the check
        run: |
          # grep precondition: if the seed string ever changes, fail as
          # "seed missing" instead of misreporting a healthy gate as broken.
          grep -q 'summaries under 72 characters' cursor/rules/operating-model.mdc
          sed -i 's/summaries under 72 characters/summaries under 720 characters/' cursor/rules/operating-model.mdc
          if python3 scripts/conventions render-rule --check; then
            echo "seeded fragment drift did NOT fail the gate" >&2
            exit 1
          fi
          git checkout -- cursor/rules/operating-model.mdc
          echo "gate correctly rejects seeded drift"

  checker-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checker test suites (defer-lint, close-reason-lint, banned-token-scan, docs-path-lint, core-manifest, plugin-manifests, neutrality-scan)
        # The profile-driven checkers' drift guards — fallback parity pins,
        # verbatim plumbing pins, exclusion-contract fixtures, resolution-
        # posture tests — must die in kit CI, not in a target repo (8dx
        # Tier 1 architect I2). test_core_manifest guards the core-tier
        # content list and its bd-cleanliness; test_neutrality_scan guards
        # the wider distributed surface against private-tool names, which
        # ship verbatim into adopters' repos. test_tier2_assemble guards the
        # same neutrality property behaviorally, on the one distributed
        # artifact that used to assert a vendor lineup. test_conventions runs
        # in fragment-regen; test_tdd_ledger runs in tdd-ledger-verify.yml.
        working-directory: scripts/tests
        run: python3 -m unittest test_defer_lint test_close_reason_lint test_banned_token_scan test_docs_path_lint test_core_manifest test_plugin_manifests test_neutrality_scan test_tier2_assemble

  docs-path-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fenced doc commands reference real script paths
        # The playbook-init.sh 404: during a rename wave, active docs
        # taught a script name that no longer existed in the tree. This
        # gate makes doc/script drift mechanical instead of a manual
        # sweep. Existence check only — nothing is executed; the suite in
        # checker-suites guards the checker itself.
        run: python3 scripts/docs-path-lint --root .

  neutrality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Distributed content names no vendor, person, or private tool
        # AGENTS.md declares neutrality as law; before this gate it had no
        # checker, and four violations shipped — one a private-tool directive
        # in an always-on rule that reached every sync target. Reporter only;
        # the suite in checker-suites guards the checker itself.
        run: python3 scripts/neutrality-scan --root .
      - name: Gate self-test — a seeded leak must fail the scan
        run: |
          # Seeded into the heuristic class on purpose: it is the only class
          # that catches an unlisted name, so it is the one whose failure
          # would be silent. The seed name appears in no term list.
          #
          # The shape is chosen, not arbitrary. An earlier seed ("Frobnitz")
          # was a plain Capitalized word, which the heuristic's original
          # too-narrow pattern already matched — so the self-test would have
          # sailed through the exact regression it exists to catch. A
          # multi-word name with an internal capital matches only the widened
          # pattern.
          printf 'Read Chrome DevTools MCP traces before filing.\n' \
            > cursor/rules/seeded-leak.mdc
          if python3 scripts/neutrality-scan --root .; then
            echo "seeded neutrality leak did NOT fail the gate" >&2
            exit 1
          fi
          rm -f cursor/rules/seeded-leak.mdc
          python3 scripts/neutrality-scan --root .
          echo "gate correctly rejects a seeded leak and passes once removed"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck scripts/*.sh + lib + the house-rules dispatcher
        # -S warning: fail on warnings and errors; info/style stay advisory.
        # scripts/lib/*.sh is sourced by both writers into a target repo, so
        # it is on the critical path and belongs in the gate; -x follows the
        # source directives so the libs are checked in context too.
        run: shellcheck -S warning -x scripts/*.sh scripts/lib/*.sh scripts/house-rules

  marker-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer marker fixture tests
        # Throwaway HOME per case; guards fresh-install idempotency and the
        # malformed-marker refusal paths in the three installers (shellcheck
        # is blind to logic regressions here).
        run: bash scripts/tests/test_marker_blocks.sh

  profile-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Profile distribution + profile_drift SUMMARY contract fixtures
        # Throwaway HOME + mktemp repo; pins the byte-identical copy, the
        # exact SUMMARY key string agents dispatch on, its precedence over
        # CLI drift keys, and the absent-profile optional branch (the one
        # mode where the doctor could lie healthy).
        run: bash scripts/tests/test_profile_distribution.sh

  sync-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The --version downgrade case resolves a release tag; the
          # default shallow checkout has no tags and the case would skip
          # itself into a silently green gate.
          fetch-depth: 0
      - name: Sync file-ownership fixtures (project rules must survive)
        # Throwaway HOME + mktemp target. Pins the ownership contract that
        # two successive bugs broke (process-kit-2d6): a filename is not
        # provenance, so removal requires the bytes to match a version the
        # kit shipped AND an explicit --retire; a default sync deletes
        # nothing. Also pins the .bak on the deletion path, byte-level
        # comparison on the claude overwrite path, and exactness of the
        # kit's own generated claude/rules/.
        run: bash scripts/tests/test_sync_cleanup.sh

  init-backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Re-running init never destroys a local edit
        # Throwaway HOME + mktemp repo. process-kit-2d6 gave the sync path a
        # recoverable copy before every destructive write; init writes into
        # the same directories through a second door and had none, so a
        # re-run silently ate local edits to rules, skills, the conventions
        # profile, and the distributed CLIs. Coverage is pattern-class, not a
        # list of sites: it installs the full surface (--tool both --skills),
        # edits every delivered file, and demands one .bak per edited file, so
        # a write site added later is covered without editing the suite. Also
        # pins the shared-implementation requirement, the --unsafe waiver, the
        # AGENTS.md marker-refresh backup, the absence of .bak litter when
        # nothing changed, and that an unbackupable file is never overwritten.
        run: bash scripts/tests/test_init_backup.sh

  tier-mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tier stamp, tier-aware doctor, sync exclusion, upgrade offer
        # Throwaway HOME + mktemp repo; pins .house-rules-tier write,
        # core doctor N/A for beads/scratchpad/sync-targets, core never
        # registers sync-targets, and the core-upgrade-offer rule contract.
        run: bash scripts/tests/test_tier_mechanics.sh
