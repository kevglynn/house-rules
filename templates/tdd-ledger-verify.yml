# TDD evidence-ledger CI gate — distributed by house-rules init.
# Verifies red-before-green ordering in .tdd-ledger.jsonl on every push/PR.
# The CLI lives at scripts/tdd-ledger in this repo (also distributed by init).
#
# Intent note: this template deliberately diverges from the kit's own
# .github/workflows/tdd-ledger-verify.yml — the kit's copy also runs the
# CLI's Python test suite (scripts/tests/test_tdd_ledger.py), which is not
# distributed to target repos. Same gate, minus the kit-internal tests.

name: tdd-ledger verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify TDD evidence ledger
        # No existence guard: verify exits 0 on a missing ledger — the CLI
        # owns that policy, not the workflow.
        run: python3 scripts/tdd-ledger verify
      - name: Gate self-test — a seeded violation must fail verify
        run: |
          seeded=$(mktemp)
          echo '{"event":"green","test_id":"seeded","bead":"x","output_digest":"d","commit":"c","ts":"2026-01-01T00:00:00+00:00"}' > "$seeded"
          if python3 scripts/tdd-ledger verify --ledger "$seeded"; then
            echo "seeded green-without-red did NOT fail the gate" >&2
            exit 1
          fi
          echo "gate correctly rejects seeded violation"
